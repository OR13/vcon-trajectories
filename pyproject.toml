[project]
name = "vcon-trajectories"
version = "0.2.0"
description = "Map vendor-native agent trajectories (Claude Code, Codex CLI, Gemini CLI) onto the IETF vCon ai_agent extension (draft-birkholz-vcon-ai-agent-extension) and validate against its CDDL."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []   # converter + parsers are stdlib-only

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.optional-dependencies]
# corpus fetching (scripts/build.py) reads SWE-chat parquet
corpora = ["pyarrow>=15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcon_trajectories"]
